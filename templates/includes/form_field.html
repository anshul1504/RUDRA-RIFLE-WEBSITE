{% if field.is_hidden %}{{ field }}{% else %}
<div class="mb-3">
  {% if field.name == "consent" %}
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}<span class="req" aria-hidden="true"> *</span></label>
    </div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true">*</span>{% elif req_when_minor %}<span class="req req-minor" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error" role="alert"><i class="bi bi-exclamation-circle" aria-hidden="true"></i> {{ error }}</div>{% endfor %}
</div>
{% endif %}
