<div class="accordion" id="faqAccordion">
  {% for f in faqs %}
  <div class="accordion-item">
    <h3 class="accordion-header">
      <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ f.pk }}" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="faq{{ f.pk }}">{{ f.question }}</button>
    </h3>
    <div id="faq{{ f.pk }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faqAccordion">
      <div class="accordion-body">{{ f.answer|linebreaksbr }}</div>
    </div>
  </div>
  {% endfor %}
</div>
