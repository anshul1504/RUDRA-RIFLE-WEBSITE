{% extends "base.html" %}
{% block title %}Message sent | {{ site.organisation_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container text-center" style="max-width:40rem">
    <i class="bi bi-check-circle" style="font-size:3.5rem;color:var(--gold-deep)" aria-hidden="true"></i>
    <h1 class="h2 mt-3">Dhanyavad! Your message has been sent.</h1>
    <p class="lead mx-auto">We will reply as soon as we can. For anything urgent, call <a href="{{ site.phone_href }}">{{ site.phone }}</a>.</p>
    <a href="{% url 'core:home' %}" class="btn btn-rudra mt-3">Back to home</a>
  </div>
</section>
{% endblock %}
